name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.2"
      - name: Test release detection and Issue deduplication
        run: python3 -m unittest discover -s Tests/Scripts
      - name: Verify prepared OpenSSL sources
        run: |
          git submodule update --init --checkout vendor/openssl
          python3 Scripts/generate-openssl-sources.py --check
      - name: Build
        run: swift build
      - name: Test cryptographic operations
        run: swift test

  linux:
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install source verification tools
        run: |
          apt-get update -q
          apt-get install -y python3 perl make
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/vendor/openssl"
      - name: Test release detection and Issue deduplication
        run: python3 -m unittest discover -s Tests/Scripts
      - name: Verify prepared OpenSSL sources
        run: |
          git submodule update --init --checkout vendor/openssl
          python3 Scripts/generate-openssl-sources.py --check
      - name: Build
        run: swift build
      - name: Test cryptographic operations
        run: swift test
