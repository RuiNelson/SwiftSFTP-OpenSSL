name: Check OpenSSL releases

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: openssl-release-check
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Report a newer stable OpenSSL release
        run: python3 Scripts/check-openssl-release.py --issue
        env:
          GH_TOKEN: ${{ github.token }}
